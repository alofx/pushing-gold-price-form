<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pushing Gold — José's Easy Price Form</title>
  <style>
    :root{color-scheme:dark;--gold:#d6aa4b;--ink:#10100f}
    *{box-sizing:border-box}body{margin:0;background:#0c0c0b;color:#fff;font:18px/1.5 Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(680px,100%);background:#171715;border:1px solid #4b4029;border-radius:20px;padding:clamp(28px,7vw,60px);text-align:center;box-shadow:0 22px 60px #0008}
    .mark{font-weight:900;letter-spacing:.16em;color:var(--gold);font-size:14px}h1{font-size:clamp(34px,7vw,58px);line-height:1.05;margin:18px 0}p{color:#ddd;margin:0 auto 28px;max-width:520px}
    a{display:inline-block;background:var(--gold);color:var(--ink);font-weight:900;text-decoration:none;padding:17px 25px;border-radius:10px;font-size:20px}
    small{display:block;color:#aaa;margin-top:20px}
  </style>
</head>
<body>
  <main>
    <div class="mark">PUSHING GOLD</div>
    <h1>José's Easy Price Form</h1>
    <p>Open the form, type the prices you know, save it, and send it back. Estimates are okay.</p>
    <a href="Pushing-Gold-Easy-Price-Form.pdf" download>Open the form</a>
    <small>Three short pages. Large boxes. Simple examples.</small>
  </main>
</body>
</html>
